<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>S05 touch</title>
<link rel="stylesheet" href="common.css">
<style>
/* 5.75 s (out-fades end at 5.6). Texture grid: tiles fade in 0.6-1.3, labels 1.2-2.6, caption 2.8-6.1 */
.tag{background:var(--touch)}
#head{position:absolute;left:80px;top:70px;width:1760px;display:flex;align-items:center;gap:34px}
#head .h2{font-size:60px}
#legend{margin-left:auto;display:flex;gap:28px;font-family:var(--display);font-weight:600;font-size:28px;color:var(--ink-soft)}
#legend span{display:flex;align-items:center;gap:10px}
#legend i{width:20px;height:20px;border-radius:50%;display:inline-block}
#grid{position:absolute;left:80px;top:232px;width:1760px;display:grid;grid-template-columns:repeat(4,1fr);gap:26px}
.tile{position:relative;height:296px;border-radius:26px;overflow:hidden;box-shadow:0 12px 30px rgba(51,37,28,.14)}
.tile img{width:100%;height:100%;object-fit:cover}
.tile .pill{position:absolute;left:18px;bottom:18px;display:flex;align-items:center;gap:10px;background:rgba(255,253,249,.94);color:var(--ink);font-size:27px;padding:10px 20px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.tile .pill i{width:16px;height:16px;border-radius:50%;flex:none}
</style></head>
<body>
<div id="head">
  <div class="tag a" style="--i:.15s;--o:5.2s">03 · Touch</div>
  <h2 class="h2 a" style="--i:.3s;--o:5.2s">Every animal feels different.</h2>
  <div id="legend" class="a" style="--i:.5s;--o:5.2s"><span><i style="background:var(--rust)"></i>Red Panda</span><span><i style="background:var(--taupe)"></i>Sloth</span></div>
</div>
<div id="grid">
  <div class="tile f" style="--i:.6s;--o:5.2s"><img src="../../assets/closeups/curly-mane.jpg" alt=""><div class="pill a" style="--i:1.0s;--o:5.2s"><i style="background:var(--rust)"></i>Curly mane</div></div>
  <div class="tile f" style="--i:.7s;--o:5.2s"><img src="../../assets/closeups/redpanda-ear.jpg" alt=""><div class="pill a" style="--i:1.15s;--o:5.2s"><i style="background:var(--rust)"></i>Silky-smooth ears</div></div>
  <div class="tile f" style="--i:.8s;--o:5.2s"><img src="../../assets/closeups/waffle-belly.jpg" alt=""><div class="pill a" style="--i:1.3s;--o:5.2s"><i style="background:var(--rust)"></i>Waffle-knit belly</div></div>
  <div class="tile f" style="--i:.9s;--o:5.2s"><img src="../../assets/closeups/paw-pad.jpg" alt=""><div class="pill a" style="--i:1.45s;--o:5.2s"><i style="background:var(--rust)"></i>Ribbed paw pads</div></div>
  <div class="tile f" style="--i:1.0s;--o:5.2s"><img src="../../assets/closeups/sloth-fur.jpg" alt=""><div class="pill a" style="--i:1.6s;--o:5.2s"><i style="background:var(--taupe)"></i>Long-pile fur</div></div>
  <div class="tile f" style="--i:1.1s;--o:5.2s"><img src="../../assets/closeups/sloth-face.jpg" alt=""><div class="pill a" style="--i:1.75s;--o:5.2s"><i style="background:var(--taupe)"></i>Smooth face</div></div>
  <div class="tile f" style="--i:1.2s;--o:5.2s"><img src="../../assets/closeups/sloth-claws.jpg" alt=""><div class="pill a" style="--i:1.9s;--o:5.2s"><i style="background:var(--taupe)"></i>Textured claws</div></div>
  <div class="tile f" style="--i:1.3s;--o:5.2s"><img src="../../assets/closeups/sloth-foot-2.jpg" alt=""><div class="pill a" style="--i:2.05s;--o:5.2s"><i style="background:var(--taupe)"></i>Paw-pad feet</div></div>
</div>
<div class="cap a" style="--i:2.15s;--o:5.2s;left:80px;right:80px;max-width:none;text-align:center">Hidden texture patches on belly, paws and ears — it just looks like a plush you&nbsp;love.</div>
</body></html>
