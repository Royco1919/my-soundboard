<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>S10 end card</title>
<link rel="stylesheet" href="common.css">
<style>
/* 4 s, holds to the last frame (no fade-out). Sowala wordmark is the hero word. */
#hero{position:absolute;left:100px;top:50px;height:830px}
#hero img{height:830px;width:auto}
#txt{position:absolute;left:960px;top:244px;width:880px}
#txt .wordmark{font-size:132px}
#desc{font-family:var(--display);font-weight:600;font-size:46px;color:var(--ink-soft);margin-top:10px;letter-spacing:.01em}
#tag{font-family:var(--body);font-weight:800;font-size:42px;color:var(--ink);margin-top:54px;line-height:1.3}
#origin{font-family:var(--body);font-weight:600;font-size:34px;color:var(--ink-soft);margin-top:14px;line-height:1.3}
#mark{display:flex;align-items:center;gap:18px;margin-top:44px}
#mark .rule{width:88px;height:6px;border-radius:3px;background:var(--rust)}
#mark span{font-family:var(--display);font-weight:600;font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
#disc{position:absolute;left:210px;right:210px;bottom:72px;font-size:27px;line-height:1.4;color:var(--ink-soft);font-weight:600;text-align:center}
</style></head>
<body>
<div id="hero" class="f" style="--i:.1s"><img class="shadow" src="../../assets/clean/group-sloth-first.png" alt=""></div>
<div id="txt">
  <div class="wordmark a" style="--i:.3s">Sowala</div>
  <div id="desc" class="a" style="--i:.5s">Weighted Sensory Companions</div>
  <div id="tag" class="a" style="--i:.9s">Comfort, one hug at a time.</div>
  <div id="origin" class="a" style="--i:1.2s">Inspired by a therapist. Created with love.</div>
  <div id="mark" class="a" style="--i:1.3s"><div class="rule"></div><span>Concept prototype</span></div>
</div>
<div id="disc" class="a" style="--i:.6s">Not a medical device. Concept prototype — final weights, materials and age grading are subject to third-party safety testing (ASTM&nbsp;F963&nbsp;/&nbsp;CPSIA) before&nbsp;sale.</div>
</body></html>
