<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>S09 age and safety</title>
<link rel="stylesheet" href="common.css">
<style>
/* 4.0 s (out-fades end at 3.85) */
#wrap{position:absolute;left:80px;top:0;width:1760px;height:1080px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px}
#wrap .h1{font-size:70px;text-align:center}
#chips{display:grid;grid-template-columns:1fr 1fr;gap:26px;width:1400px}
.chip{display:flex;align-items:center;gap:26px;padding:28px 34px;font-family:var(--display);font-weight:600;font-size:38px;color:var(--ink)}
.chip .ic{width:84px;height:84px;border-radius:24px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:none;font-family:var(--display);font-weight:700;font-size:34px;color:var(--rust)}
.chip .ic svg{width:48px;height:48px;fill:none;stroke:var(--rust);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#foot{font-size:28px;color:var(--ink-soft);font-weight:600;text-align:center}
</style></head>
<body>
<div id="wrap">
  <h1 class="h1 a" style="--i:.2s;--o:3.45s">Good to know</h1>
  <div id="chips">
    <div class="card chip a" style="--i:.4s;--o:3.45s"><div class="ic">3+</div>Ages 3+</div>
    <div class="card chip a" style="--i:.55s;--o:3.45s"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M5.3 5.3l13.4 13.4"/><circle cx="12" cy="10" r="3"/><path d="M7.5 18a5 5 0 0 1 9 0"/></svg></div>Not for infants</div>
    <div class="card chip a" style="--i:.7s;--o:3.45s"><div class="ic"><svg viewBox="0 0 24 24"><path d="M15.5 3.5a8 8 0 1 0 5 12.5 8 8 0 0 1-5-12.5z"/><path d="M4 4l16 16"/></svg></div>Not a sleep product</div>
    <div class="card chip a" style="--i:.85s;--o:3.45s"><div class="ic"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></div>Adult supervision with the warm insert</div>
  </div>
  <div id="foot" class="a" style="--i:.95s;--o:3.45s">Removable inserts · machine-washable outer plush · designed for sensory exploration and comfort</div>
</div>
</body></html>
