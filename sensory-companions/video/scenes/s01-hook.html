<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>S01 hook</title>
<link rel="stylesheet" href="common.css">
<style>
/* 5.5 s. Blurred full-bleed copy of the client's clip + sharp portrait clip on the right. */
#bgv{position:absolute;left:-60px;top:-60px;width:2040px;height:1200px;object-fit:cover;filter:blur(34px) brightness(.62) saturate(1.15)}
#veil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(51,37,28,.72) 0%,rgba(51,37,28,.45) 45%,rgba(51,37,28,.15) 100%)}
#clip{position:absolute;left:1240px;top:90px;width:502px;height:900px;border-radius:40px;overflow:hidden;
  box-shadow:0 40px 90px rgba(0,0,0,.45),0 0 0 6px rgba(255,253,249,.18)}
#clip video{width:502px;height:900px;object-fit:cover}
#txt{position:absolute;left:120px;top:300px;width:1040px;color:#fff}
#txt .eyebrow{color:#F3E3D3;margin-bottom:22px}
#txt .h1{color:#fff;font-size:104px;text-shadow:0 6px 30px rgba(0,0,0,.35)}
#txt .sub{color:#F7F1E8;font-size:40px;margin-top:28px;text-shadow:0 3px 14px rgba(0,0,0,.35)}
html[lang=he] #txt{direction:rtl;text-align:right;left:auto;right:760px;width:1040px}
html[lang=he] #clip{left:100px}
html[lang=he] #veil{background:linear-gradient(270deg,rgba(51,37,28,.72) 0%,rgba(51,37,28,.45) 45%,rgba(51,37,28,.15) 100%)}
#brand{position:absolute;left:120px;bottom:80px;color:#F3E3D3;font-family:var(--display);font-weight:600;font-size:28px;letter-spacing:.1em}
html[lang=he] #brand{left:auto;right:120px}
#note{position:absolute;right:80px;bottom:80px;color:#F3E3D3;font-size:24px;font-weight:600;opacity:.9}
html[lang=he] #note{right:auto;left:80px;direction:rtl}
</style></head>
<body>
<div class="f" style="--i:0s;--o:5.1s">
  <video id="bgv" src="../../assets/user-clip.webm" muted preload="auto" data-start="0" data-offset="6.5"></video>
  <div id="veil"></div>
</div>
<div id="clip" class="f" style="--i:.15s;--o:5.1s">
  <video src="../../assets/user-clip.webm" muted preload="auto" data-start="0" data-offset="6.5"></video>
</div>
<div id="txt">
  <div class="eyebrow a" style="--i:.5s;--o:5s">Sowala · Piga</div>
  <h1 class="h1 a" style="--i:.7s;--o:5s"><span class="en">Weighted<br>Sensory<br>Companions</span><span class="he">חברים<br>משוקללים<br>לחוויה חושית</span></h1>
  <div class="sub a" style="--i:1.4s;--o:5s"><span class="en">Cozy. Soothing. Grounding.</span><span class="he">נעים. מרגיע. מקרקע.</span></div>
</div>
<div id="brand" class="a" style="--i:1.8s;--o:5s"><span class="en">CONCEPT PROTOTYPE</span><span class="he">אב-טיפוס קונספט</span></div>
</body></html>
