<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>S01 hook</title>
<link rel="stylesheet" href="common.css">
<style>
/* 4.5 s. Blurred full-bleed copy of the client's clip (sloth pair, offset 13.0 s) + sharp portrait clip on the right.
   The only dark scene: the footage fades to cream linearly over 1.1 s (3.25-4.35) so the cut to the cream scenes is not a flash; the text leaves first (3.6-4.1). */
.f{animation:fade .5s var(--i) ease-out backwards,unfade 1.1s var(--o) linear forwards}
.a{animation:in .55s var(--i) cubic-bezier(.2,.7,.2,1) backwards,out .5s var(--o) ease-in forwards}
#bgv{position:absolute;left:-60px;top:-60px;width:2040px;height:1200px;object-fit:cover;filter:blur(34px) brightness(.62) saturate(1.15)}
#veil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(51,37,28,.72) 0%,rgba(51,37,28,.45) 45%,rgba(51,37,28,.15) 100%)}
#clip{position:absolute;left:1240px;top:90px;width:502px;height:900px;border-radius:40px;overflow:hidden;
  box-shadow:0 40px 90px rgba(0,0,0,.45),0 0 0 6px rgba(255,253,249,.18)}
#clip video{width:502px;height:900px;object-fit:cover}
#txt{position:absolute;left:120px;top:290px;width:1040px;color:#fff}
#txt .wordmark{color:#F7F1E8;font-size:44px;margin-bottom:26px;text-shadow:0 3px 14px rgba(0,0,0,.35)}
#txt .h1{color:#fff;font-size:104px;text-shadow:0 6px 30px rgba(0,0,0,.35)}
#txt .sub{color:#F7F1E8;font-size:40px;margin-top:28px;text-shadow:0 3px 14px rgba(0,0,0,.35)}
#brand{position:absolute;left:120px;bottom:80px;color:#F3E3D3;font-family:var(--display);font-weight:600;font-size:28px;letter-spacing:.1em}
</style></head>
<body>
<div class="f" style="--i:0s;--o:3.25s">
  <video id="bgv" src="../../assets/user-clip.webm" muted preload="metadata" data-start="0" data-offset="13.0"></video>
  <div id="veil"></div>
</div>
<div id="clip" class="f" style="--i:.15s;--o:3.25s">
  <video src="../../assets/user-clip.webm" muted preload="metadata" data-start="0" data-offset="13.0"></video>
</div>
<div id="txt">
  <div class="wordmark a" style="--i:.3s;--o:3.6s">Sowala</div>
  <h1 class="h1 a" style="--i:.45s;--o:3.6s">Weighted<br>Sensory<br>Companions</h1>
  <div class="sub a" style="--i:.9s;--o:3.6s">Cozy. Soothing. Grounding.</div>
</div>
<div id="brand" class="a" style="--i:1.0s;--o:3.6s">CONCEPT PROTOTYPE</div>
</body></html>
