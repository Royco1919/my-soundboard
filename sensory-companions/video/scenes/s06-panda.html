<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>S06 red panda signature</title>
<link rel="stylesheet" href="common.css">
<style>
/* 5.5 s (out-fades end at 5.35). Tail squeezes (loop from 1.0), crinkle marks pulse; paw pad ribs + thumb rubs (loop from 2.6) */
.tag{background:var(--rust)}
#tail{position:absolute;left:0;top:0;width:520px;height:600px}
#tailShape{transform-origin:260px 330px;animation:squeeze 1.6s 1s ease-in-out infinite}
@keyframes squeeze{0%{transform:scale(1,1)}35%{transform:scale(.86,1.06)}55%{transform:scale(.86,1.06)}100%{transform:scale(1,1)}}
#arrL{animation:press 1.6s 1s ease-in-out infinite}
@keyframes press{0%{transform:translate(0,0);opacity:.35}35%{transform:translate(34px,34px);opacity:1}55%{transform:translate(34px,34px);opacity:1}100%{transform:translate(0,0);opacity:.35}}
#arrR{animation:press2 1.6s 1s ease-in-out infinite}
@keyframes press2{0%{transform:translate(0,0);opacity:.35}35%{transform:translate(-34px,-34px);opacity:1}55%{transform:translate(-34px,-34px);opacity:1}100%{transform:translate(0,0);opacity:.35}}
.crk{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:0;animation:crk 1.6s 1s ease-out infinite}
@keyframes crk{0%{opacity:0}30%{opacity:0}45%{opacity:1}85%{opacity:0}100%{opacity:0}}
#pad{position:absolute;left:600px;top:30px;width:380px;height:380px}
#thumb{animation:rub 1.4s 2.6s ease-in-out infinite}
@keyframes rub{0%{transform:translate(-70px,0)}50%{transform:translate(70px,0)}100%{transform:translate(-70px,0)}}
.rib{animation:ribGlow 1.4s var(--d) ease-in-out infinite}
@keyframes ribGlow{0%{stroke:#4a3325}50%{stroke:#7a5a45}100%{stroke:#4a3325}}
.lbl{left:600px}
.photo-col img{height:720px!important}
</style></head>
<body class="feat">
<div class="photo-col f" style="--i:.1s;--o:4.95s"><img class="shadow" src="../../assets/clean/redpanda-small.png" alt=""></div>
<div class="head">
  <div class="tag a" style="--i:.2s;--o:4.95s">04 · Calm &amp; Fidget</div>
  <h2 class="h2 a" style="--i:.35s;--o:4.95s">Red Panda: a tail you can squeeze.</h2>
</div>
<div class="diag">
  <svg id="tail" viewBox="0 0 520 600" class="f" style="--i:.5s;--o:4.95s">
    <g id="tailShape">
      <path d="M70 540 C 40 400 110 250 240 205 C 360 165 470 240 460 340 C 452 430 370 470 300 440" fill="none" stroke="#E0BFA0" stroke-width="112" stroke-linecap="round"/>
      <path d="M70 540 C 40 400 110 250 240 205 C 360 165 470 240 460 340 C 452 430 370 470 300 440" fill="none" stroke="var(--rust)" stroke-width="96" stroke-linecap="round"/>
      <path d="M70 540 C 40 400 110 250 240 205 C 360 165 470 240 460 340 C 452 430 370 470 300 440" fill="none" stroke="#F2DFC4" stroke-width="96" stroke-dasharray="46 70" stroke-dashoffset="20" opacity=".85"/>
    </g>
    <g id="arrL" fill="none" stroke="var(--ink)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="M130 130 l40 40 l-40 40"/></g>
    <g id="arrR" fill="none" stroke="var(--ink)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="M440 490 l-40 -40 l40 -40"/></g>
    <g class="crk"><path d="M300 110 l14 -26 l12 26 l14 -26"/><path d="M380 100 l8 -30 l16 22 l8 -30"/></g>
    <g class="crk" style="animation-delay:1.25s"><path d="M470 210 l22 -10 l-4 26 l22 -10"/><path d="M200 520 l16 -22 l12 26 l14 -26"/></g>
  </svg>
  <svg id="pad" viewBox="0 0 420 420" class="f" style="--i:2.2s;--o:4.95s">
    <rect x="40" y="60" width="340" height="300" rx="120" fill="#5b3f2e"/>
    <g fill="none" stroke-width="10" stroke-linecap="round">
      <path class="rib" style="--d:2.6s" d="M110 150 H310"/><path class="rib" style="--d:2.8s" d="M96 200 H324"/><path class="rib" style="--d:3.0s" d="M96 250 H324"/><path class="rib" style="--d:3.2s" d="M110 300 H310"/>
    </g>
    <g id="thumb"><ellipse cx="210" cy="225" rx="54" ry="78" fill="rgba(217,204,185,.85)" stroke="var(--taupe)" stroke-width="4"/></g>
  </svg>
  <div class="lbl a" style="left:40px;top:540px;--i:1.2s;--o:4.95s"><span class="dot" style="background:var(--rust)"></span>Squeezable crinkle tail</div>
  <div class="lbl a" style="left:600px;top:430px;--i:2.4s;--o:4.95s"><span class="dot" style="background:var(--rust)"></span>Ribbed paw pads for thumb-rubbing</div>
</div>
<div class="cap a" style="--i:.8s;--o:4.95s">Squeezable crinkle tail + ribbed paw pads for thumb-rubbing — a fidget built into the&nbsp;animal.</div>
</body></html>
