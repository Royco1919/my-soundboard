<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>S02 four comforts</title>
<link rel="stylesheet" href="common.css">
<style>
/* 5.0 s. Out-fades end at 4.85 s. */
#txt{position:absolute;left:120px;top:120px;width:860px}
#txt .h1{margin-top:16px;font-size:82px}
#rows{margin-top:44px;display:flex;flex-direction:column;gap:18px}
.row{display:flex;align-items:center;gap:22px}
.row .ic{width:82px;height:82px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.row .ic svg{width:44px;height:44px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.row .t{font-family:var(--display);font-weight:700;font-size:36px;line-height:1.05}
.row .d{font-size:27px;color:var(--ink-soft);font-weight:600;margin-top:4px}
#hero{position:absolute;left:1000px;top:60px;height:880px}
#hero img{height:880px;width:auto}
#cap2{max-width:860px}
</style></head>
<body>
<div id="txt">
  <div class="eyebrow a" style="--i:.2s;--o:4.45s">The system</div>
  <h1 class="h1 a" style="--i:.35s;--o:4.45s">One companion.<br>Four kinds of&nbsp;comfort.</h1>
  <div id="rows">
    <div class="row a" style="--i:1.1s;--o:4.45s"><div class="ic" style="background:var(--weight)"><svg viewBox="0 0 24 24"><path d="M8 8V6a4 4 0 0 1 8 0v2"/><path d="M5 8h14l1.5 11a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg></div>
      <div><div class="t">Weight</div><div class="d">Removable weighted pouch</div></div></div>
    <div class="row a" style="--i:1.4s;--o:4.45s"><div class="ic" style="background:linear-gradient(135deg,var(--warm),var(--cool))"><svg viewBox="0 0 24 24"><path d="M10 4a2 2 0 0 1 4 0v9.5a4 4 0 1 1-4 0z"/><path d="M12 9v6"/></svg></div>
      <div><div class="t">Warm &amp; Cool</div><div class="d">Chill it or warm it — separate insert</div></div></div>
    <div class="row a" style="--i:1.7s;--o:4.45s"><div class="ic" style="background:var(--touch)"><svg viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11"/><path d="M11 10.5V4.5a1.5 1.5 0 0 1 3 0V11"/><path d="M14 10.5V6a1.5 1.5 0 0 1 3 0v6"/><path d="M17 11.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-2a6 6 0 0 1-5-2.7L4.3 14a1.6 1.6 0 0 1 2.6-1.9L8 13.5"/></svg></div>
      <div><div class="t">Touch</div><div class="d">Hidden textures — every animal feels different</div></div></div>
    <div class="row a" style="--i:2.0s;--o:4.45s"><div class="ic" style="background:var(--rust)"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg></div>
      <div><div class="t">Calm &amp; Fidget</div><div class="d">One signature feature per animal</div></div></div>
  </div>
</div>
<div id="hero" class="f" style="--i:.1s;--o:4.45s"><img class="shadow" src="../../assets/clean/group-sloth-first.png" alt=""></div>
<div id="cap2" class="cap a" style="--i:1.9s;--o:4.45s">All inserts are removable — the outer plush goes in the&nbsp;wash.</div>
</body></html>
